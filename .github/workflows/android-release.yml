name: Release (tag v* / plenka-v*) → GitHub Release + Telegram

# Триггер — пуш git-тега вида v1.2.3 (Filmax) или plenka-v0.0.1 (второе приложение «Плёнка»).
# Собирает ПОДПИСАННЫЙ APK (R8 + shrinkResources), публикует его в GitHub Release с
# авто-changelog и дублирует в Telegram (с учётом лимита бота 50 МБ). Релиз «Плёнки» не
# помечается как Latest: этот значок — у Filmax, его по `releases/latest` ищут старые версии.
#
# Требуемые секреты репозитория:
#   KEYSTORE_BASE64   — release-keystore (.jks), закодированный base64
#   KEYSTORE_PASSWORD — пароль keystore
#   KEY_ALIAS         — алиас ключа
#   KEY_PASSWORD      — пароль ключа
#   GOOGLE_SERVICES_JSON_BASE64 — app/google-services.json (Firebase Crashlytics), base64;
#                                 не задан — релиз собирается без крэш-репортинга
#   TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID — уже используются debug-workflow
on:
  push:
    tags: [ "v*", "plenka-v*" ]
  # Ручной перезапуск для уже существующего тега: удобно, когда Release создан заранее
  # (например, через UI) и `gh release create` упал бы с «tag already exists», или когда
  # нужно доложить APK к готовому релизу. Собирает ровно код тега `tag`.
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег для сборки/публикации (например v1.7.1 или plenka-v0.0.1)"
        required: true

permissions:
  contents: write   # нужно для создания GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    # Единый источник имени тега: пуш даёт github.ref_name, ручной запуск — inputs.tag.
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout (полная история + теги)
        uses: actions/checkout@v4
        with:
          # versionCode = число коммитов, versionName = из тега — нужна вся история.
          # ref: собираем именно код тега (важно для ручного запуска с ветки master).
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      # Какое приложение выпускаем — по префиксу тега. Дальше шаги берут всё отсюда: задачу
      # Gradle, папку APK, имя файла, заголовок релиза и значок Latest.
      - name: Resolve app by tag
        run: |
          case "$TAG" in
            plenka-v[0-9]*)
              {
                echo "TAG_PREFIX=plenka-v"
                echo "GRADLE_TASK=:app:assemblePlenka"
                echo "APK_DIR=plenka"
                echo "APK_NAME=plenka"
                echo "APP_TITLE=Плёнка"
                echo "MAKE_LATEST=false"
              } >> "$GITHUB_ENV"
              ;;
            v[0-9]*)
              {
                echo "TAG_PREFIX=v"
                echo "GRADLE_TASK=:app:assembleRelease"
                echo "APK_DIR=release"
                echo "APK_NAME=filmax"
                echo "APP_TITLE=Filmax"
                echo "MAKE_LATEST=true"
              } >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Тег $TAG не похож ни на vX.Y.Z, ни на plenka-vX.Y.Z."
              exit 1
              ;;
          esac

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Декодируем keystore из base64-секрета во временный файл раннера.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Секрет KEYSTORE_BASE64 не задан — нечем подписывать release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/filmax-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/filmax-release.jks" >> "$GITHUB_ENV"

      # Crashlytics: конфиг Firebase из секрета. Файл в .gitignore (репо публичное), а его
      # наличие включает плагины google-services/crashlytics в app/build.gradle.kts —
      # вместе с ними в релиз уезжает и mapping-файл R8 для читаемых стектрейсов.
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::Секрет GOOGLE_SERVICES_JSON_BASE64 не задан — релиз без Crashlytics."
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Assemble signed release APK
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # In-app update: fine-grained токен (только чтение contents этого репо) зашивается в
          # APK, чтобы приложение читало Releases приватного репозитория. Не задан — сборка
          # пройдёт, но проверка обновлений в приложении будет молча выключена.
          UPDATE_GITHUB_TOKEN: ${{ secrets.UPDATE_GITHUB_TOKEN }}
        run: ./gradlew "$GRADLE_TASK" --stacktrace

      - name: Locate & rename APK
        id: apk
        run: |
          path=$(find . -path "*/outputs/apk/${APK_DIR}/*.apk" | head -n1)
          if [ -z "$path" ]; then echo "::error::APK (${APK_DIR}) не найден"; exit 1; fi
          version="${TAG#"$TAG_PREFIX"}"
          dest="${APK_NAME}-${version}.apk"
          cp "$path" "$dest"
          size_mb=$(( $(stat -c%s "$dest") / 1048576 ))
          {
            echo "path=$dest"
            echo "version=$version"
            echo "size_mb=$size_mb"
          } >> "$GITHUB_OUTPUT"
          echo "APK: $dest (${size_mb} МБ)"

      # Авто-changelog из коммитов между предыдущим и текущим тегом того же приложения.
      # Коммиты по Conventional Commits (feat/fix/perf/...), группируем по типам. У первого
      # релиза предыдущего тега нет, и вместо списка всей истории — одна строка: заметки к нему
      # пишутся руками.
      - name: Generate changelog
        id: changelog
        run: |
          footer() {
            echo "---"
            echo "versionName ${{ steps.apk.outputs.version }} · размер ${{ steps.apk.outputs.size_mb }} МБ"
            echo "Собрано из тега \`${TAG}\`."
          }
          prev=$(git describe --tags --abbrev=0 --match "${TAG_PREFIX}[0-9]*" "${TAG}^" 2>/dev/null || true)
          if [ -z "$prev" ]; then
            { echo "Первый релиз ${APP_TITLE}."; echo; footer; } > "$RUNNER_TEMP/changelog.md"
            cat "$RUNNER_TEMP/changelog.md"
            exit 0
          fi
          range="${prev}..${TAG}"
          echo "Изменения с ${prev}:" > "$RUNNER_TEMP/changelog.md"
          echo >> "$RUNNER_TEMP/changelog.md"
          emit() {
            local prefix="$1" title="$2"
            local lines
            lines=$(git log --no-merges --pretty='%s' "$range" | grep -E "^${prefix}(\(.+\))?(!)?: " || true)
            if [ -n "$lines" ]; then
              echo "### ${title}" >> "$RUNNER_TEMP/changelog.md"
              printf '%s\n' "$lines" | sed -E "s/^${prefix}(\(.+\))?(!)?: /- /" >> "$RUNNER_TEMP/changelog.md"
              echo >> "$RUNNER_TEMP/changelog.md"
            fi
          }
          emit "feat" "Новое"
          emit "fix"  "Исправления"
          emit "perf" "Производительность"
          # Фолбэк, если по конвенции ничего не распозналось.
          if [ "$(wc -l < "$RUNNER_TEMP/changelog.md")" -le 2 ]; then
            echo "### Коммиты" >> "$RUNNER_TEMP/changelog.md"
            git log --no-merges --pretty='- %s' "$range" >> "$RUNNER_TEMP/changelog.md"
          fi
          footer >> "$RUNNER_TEMP/changelog.md"
          cat "$RUNNER_TEMP/changelog.md"

      # Идемпотентно: если Release уже есть (создан заранее через UI или прошлым прогоном) —
      # докладываем APK и обновляем заметки; иначе создаём. Так шаг не падает на «tag already exists».
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
          TITLE: ${{ env.APP_TITLE }} ${{ steps.apk.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/changelog.md"
            echo "GitHub Release $TAG обновлён (APK доложен)."
          else
            gh release create "$TAG" "$APK" \
              --title "$TITLE" \
              --latest="$MAKE_LATEST" \
              --notes-file "$RUNNER_TEMP/changelog.md"
            echo "GitHub Release $TAG опубликован."
          fi

      # Дублируем APK в Telegram. Лимит бота — 50 МБ; если больше — шлём ссылку на Release.
      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK: ${{ steps.apk.outputs.path }}
          VERSION: ${{ steps.apk.outputs.version }}
          SIZE_MB: ${{ steps.apk.outputs.size_mb }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Секреты Telegram не заданы — пропускаю. APK в GitHub Release."
            exit 0
          fi
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          caption=$(printf '%s %s · release\nПодписанный APK (%s МБ)\nRelease: %s' "$APP_TITLE" "$VERSION" "$SIZE_MB" "$release_url")
          if [ "$SIZE_MB" -ge 50 ]; then
            echo "::warning::APK ${SIZE_MB}MB ≥ 50MB — шлю ссылку вместо файла."
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${APP_TITLE} ${VERSION} (release, ${SIZE_MB}MB) — превышает лимит Telegram 50MB. Скачай из GitHub Release: ${release_url}"
            exit 0
          fi
          # Как в android-build.yml: причина ошибки Telegram — в лог, а релиз к этому моменту уже
          # опубликован, и сбой уведомления не должен красить его прогон.
          response=$(mktemp)
          status=$(curl -sS -o "$response" -w '%{http_code}' -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F document=@"${APK}" \
            --form-string caption="$caption")
          if [ "$status" != "200" ]; then
            reason=$(sed -n 's/.*"description":"\([^"]*\)".*/\1/p' "$response")
            echo "::warning::Telegram ответил ${status}: ${reason:-без описания}. APK в GitHub Release."
            exit 0
          fi
          echo "Release-APK отправлен в Telegram."
